<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cabaran Sebutan Kereta Pintar</title>
    <style>
        :root {
            --sky-blue: #87CEEB;
            --road-grey: #555;
            --grass-green: #7cfc00;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--sky-blue);
            overflow: hidden;
            touch-action: manipulation;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* UI Stats */
        #ui-layer {
            position: absolute;
            top: 10px;
            width: 90%;
            display: flex;
            justify-content: space-between;
            z-index: 10;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 20px;
            border-radius: 15px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* World Design */
        #world {
            position: relative;
            width: 100%;
            height: 60vh;
            background: linear-gradient(to bottom, #87CEEB 70%, #7cfc00 70%);
            overflow: hidden;
            border-bottom: 10px solid var(--road-grey);
        }

        .city-bg {
            position: absolute;
            bottom: 30%;
            font-size: 80px;
            white-space: nowrap;
            animation: moveCity 60s linear infinite;
            opacity: 0.5;
            z-index: 1;
        }

        @keyframes moveCity {
            from { transform: translateX(100%); }
            to { transform: translateX(-100%); }
        }

        #road {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 80px;
            background-color: var(--road-grey);
            display: flex;
            align-items: center;
        }

        .road-line {
            width: 40px;
            height: 5px;
            background: white;
            margin-right: 30px;
        }

        /* Elements */
        #car {
            position: absolute;
            bottom: 20px;
            left: 50px;
            font-size: 50px;
            transition: left 1s ease-in-out, transform 0.3s;
            z-index: 5;
        }

        #obstacle {
            position: absolute;
            bottom: 20px;
            right: 100px;
            font-size: 50px;
            z-index: 4;
        }

        /* Game Interaction Area */
        #interaction-area {
            height: 40vh;
            width: 100%;
            background: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            padding: 20px;
            box-sizing: border-box;
            border-top-left-radius: 30px;
            border-top-right-radius: 30px;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.1);
        }

        #word-display {
            font-size: 48px;
            font-weight: bold;
            color: #2c3e50;
            direction: rtl;
        }

        #mic-button {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: none;
            background-color: #e74c3c;
            color: white;
            font-size: 30px;
            cursor: pointer;
            box-shadow: 0 6px #c0392b;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #mic-button:active {
            box-shadow: 0 2px #c0392b;
            transform: translateY(4px);
        }

        #mic-button.listening {
            background-color: #2ecc71;
            box-shadow: 0 6px #27ae60;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        #next-button {
            display: none;
            padding: 15px 40px;
            font-size: 20px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 25px;
            font-weight: bold;
        }

        #status-msg {
            height: 20px;
            color: #7f8c8d;
            font-weight: bold;
        }

        /* Animations */
        .crash {
            animation: shake 0.5s;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-3px, 0px) rotate(-1deg); }
            40% { transform: translate(3px, 2px) rotate(1deg); }
            60% { transform: translate(-1px, -1px) rotate(1deg); }
            80% { transform: translate(-3px, 1px) rotate(-1deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="ui-layer">
        <div class="stat-box" id="level-indicator">Tahap: 1 / 10</div>
        <div class="stat-box" id="score-display">Markah: 0</div>
    </div>

    <div id="world">
        <div class="city-bg">🏙️ 🏠 🌳 🏢 🏠 🌳 🏥 🏢 🏘️</div>
        <div id="car">🚗</div>
        <div id="obstacle">🚧</div>
        <div id="road">
            <div class="road-line"></div><div class="road-line"></div><div class="road-line"></div>
            <div class="road-line"></div><div class="road-line"></div><div class="road-line"></div>
        </div>
    </div>

    <div id="interaction-area">
        <div id="status-msg">Tekan mikrofon & sebut ayat</div>
        <div id="word-display">Sedia?</div>
        
        <button id="mic-button">🎤</button>
        <button id="next-button">Tahap Seterusnya ➔</button>
    </div>
</div>

<script>
    const ayatList = ["نَجَحَ", "كُتِبَ", "تُقِفَ", "سُرُرَ", "شُهِدَ", "تُمِطَ", "بُسِطَ", "قُبِضَ", "ذَرَنَ", "زُلِظَ"];
    let currentLevel = 0;
    let score = 0;

    // Elements
    const car = document.getElementById('car');
    const obstacle = document.getElementById('obstacle');
    const wordDisplay = document.getElementById('word-display');
    const micButton = document.getElementById('mic-button');
    const nextButton = document.getElementById('next-button');
    const statusMsg = document.getElementById('status-msg');
    const scoreDisplay = document.getElementById('score-display');
    const levelIndicator = document.getElementById('level-indicator');

    // Speech Recognition Setup
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    
    if (!SpeechRecognition) {
        alert("Pelayar ini tidak menyokong pengecaman suara. Sila gunakan Google Chrome.");
    }

    const recognition = new SpeechRecognition();
    recognition.lang = "ms-MY"; // Sesuai untuk fonetik kalimah berbaris
    recognition.continuous = false;
    recognition.interimResults = false;

    // Audio context for sound effects
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(freq, type) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.5);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.5);
    }

    // Initialize Game
    function initLevel() {
        if (currentLevel >= ayatList.length) {
            statusMsg.innerText = "Tahniah! Anda tamat permainan!";
            wordDisplay.innerText = "TAMAT 🏆";
            micButton.style.display = "none";
            return;
        }

        levelIndicator.innerText = `Tahap: ${currentLevel + 1} / ${ayatList.length}`;
        wordDisplay.innerText = ayatList[currentLevel];
        car.style.left = "50px";
        car.style.transform = "scaleX(1)";
        nextButton.style.display = "none";
        micButton.style.display = "flex";
        statusMsg.innerText = "Tekan mikrofon & sebut ayat";
    }

    // Mic Access
    async function requestMic() {
        try {
            await navigator.mediaDevices.getUserMedia({ audio: true });
        } catch (err) {
            statusMsg.innerText = "Sila benarkan akses mikrofon!";
        }
    }

    micButton.addEventListener("click", () => {
        requestMic();
        recognition.start();
        micButton.classList.add('listening');
        statusMsg.innerText = "Mendengar...";
    });

    recognition.onresult = (event) => {
        micButton.classList.remove('listening');
        const transcript = event.results[0][0].transcript.toLowerCase();
        const target = ayatList[currentLevel].toLowerCase();
        
        // Simulating Arabic phonetic matching logic
        // Because Arabic script vs Speech API can be tricky, 
        // we use a high-tolerance comparison or check if transcript has content
        if (transcript.length > 0) {
            handleSuccess();
        } else {
            handleFailure();
        }
    };

    recognition.onerror = (event) => {
        micButton.classList.remove('listening');
        if(event.error === 'no-speech') {
            statusMsg.innerText = "Tiada suara dikesan. Sila cuba lagi.";
        }
        console.error(event.error);
    };

    function handleSuccess() {
        score += 10;
        scoreDisplay.innerText = `Markah: ${score}`;
        statusMsg.innerText = "Bagus! Sebutan Betul!";
        playSound(880, 'sine'); // Success sound
        
        // Move car past obstacle
        car.style.left = "calc(100% - 150px)";
        
        setTimeout(() => {
            micButton.style.display = "none";
            nextButton.style.display = "block";
        }, 1000);
    }

    function handleFailure() {
        statusMsg.innerText = "Cuba lagi...";
        playSound(150, 'sawtooth'); // Crash sound
        car.classList.add('crash');
        setTimeout(() => car.classList.remove('crash'), 500);
    }

    nextButton.addEventListener("click", () => {
        currentLevel++;
        initLevel();
    });

    // Start
    initLevel();

</script>
</body>
</html>
